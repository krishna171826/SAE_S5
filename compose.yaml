services:
  db:
    image: postgis/postgis:17-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: sae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sae_s5
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
