services:
  db:
    image: postgis/postgis:17-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: sae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sae_s5
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sae-network

  recommendation-engine:
    build: ./SAE_S5-Backend/recommendation-engine
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - sae-network

  backend:
    build: ./SAE_S5-Backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sae_s5
      - DB_USER=sae
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - FASTAPI_URL=http://recommendation-engine:8000
    depends_on:
      - db
      - recommendation-engine
    networks:
      - sae-network

volumes:
  postgres_data:

networks:
  sae-network:
    driver: bridge
